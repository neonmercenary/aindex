<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>aindex — Agentic Research Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        header h1 { margin: 0; font-size: 24px; color: var(--text-color); }
        header p { margin: 5px 0 0; color: var(--text-muted); font-size: 14px; }
        
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user-message {
            background-color: var(--accent);
            color: white;
            align-self: flex-end;
        }
        .assistant-message {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
        }
        .sources {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 5px;
        }
        
        #input-area {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        textarea {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            resize: none;
            height: 24px;
            font-family: inherit;
            font-size: 14px;
        }
        textarea:focus { outline: none; border-color: var(--accent); }
        
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .upload-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn:hover { border-color: var(--accent); color: var(--text-color); }
        
        .action-buttons {
            max-width: 900px;
            width: 100%;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .action-chip {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-chip:hover {
            border-color: var(--accent);
            color: var(--text-color);
            background-color: rgba(59, 130, 246, 0.1);
        }
        #file-input { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>aindex</h1>
        <p>Local-First Agentic Research Assistant</p>
    </header>

    <div id="chat-container">
        <div class="message assistant-message">
            Hello! I'm your local <strong>aindex</strong> research assistant. Upload your PDFs and ask anything, or use the quick actions below to analyze your local document library.
        </div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="file" id="file-input" accept=".pdf" onchange="handleFileUpload()">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Upload PDF">📁</button>
            <textarea id="query-input" placeholder="Ask a question about your documents..." rows="1" onkeydown="handleKey(event)"></textarea>
            <button class="btn" onclick="sendQuery()">Ask</button>
        </div>
        <div class="action-buttons">
            <div class="action-chip" onclick="triggerAction('research')">🔍 Do a Research</div>
            <div class="action-chip" onclick="triggerAction('summarize')">📄 Summarize Document</div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const queryInput = document.getElementById('query-input');

        function appendMessage(text, sender, sources = []) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'assistant-message'}`;
            msgDiv.innerText = text;

            if (sources && sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.innerText = 'Sources: ' + sources.join(', ');
                msgDiv.appendChild(srcDiv);
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleFileUpload() {
            const fileInput = document.getElementById('file-input');
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            appendMessage(`Uploading and indexing "${fileInput.files[0].name}"...`, 'user');
            
            try {
                const res = await fetch('/api/v1/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    appendMessage(`Successfully indexed ${data.total_chunks_indexed} chunks from ${data.filename}. Ready for research!`, 'assistant');
                } else {
                    appendMessage(`Error uploading: ${data.detail}`, 'assistant');
                }
            } catch (err) {
                appendMessage(`Upload failed: ${err.message}`, 'assistant');
            }
            fileInput.value = '';
        }

        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            queryInput.value = '';

            // Add temporary loading message
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant-message';
            loadingDiv.id = loadingId;
            loadingDiv.innerText = 'Thinking through local vector indices...';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/api/v1/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, top_k: 4 })
                });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();

                if (res.ok) {
                    appendMessage(data.answer, 'assistant', data.sources);
                } else {
                    appendMessage(`Error: ${data.detail}`, 'assistant');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage(`Connection error: ${err.message}`, 'assistant');
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuery();
            }
        }

        function triggerAction(type) {
            if (type === 'research') {
                queryInput.value = "Conduct a deep research overview of the key findings, methodology, and core conclusions across the uploaded documents.";
            } else if (type === 'summarize') {
                queryInput.value = "Provide an executive summary of the most recently uploaded document, highlighting its main goals and structured sections.";
            }
            queryInput.focus();
        }
    </script>
</body>
</html>
